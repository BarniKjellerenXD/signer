name: signer
# Signer: self-hosted iOS app signing + over-the-air install, reachable only through Tailscale.
# The tailscale container joins your tailnet as its own machine (TS_HOSTNAME) and serves
# https://<TS_HOSTNAME>.<your-tailnet>.ts.net with a real certificate -> app:8080. Nothing is exposed to the internet.
# Setup: see README.md. Copy .env.example to .env first.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    hostname: ${TS_HOSTNAME:-signer}
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-signer}
      TS_AUTHKEY: ${TS_AUTHKEY:-}          # only needed for the very first start
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  app:
    build: .
    image: signer:local
    restart: unless-stopped
    # no published ports: only the tailscale container talks to app:8080
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      OWNER_LOGINS: ${OWNER_LOGINS:-}
      SITE_NAME: ${SITE_NAME:-Signer}
      TZ: ${TZ:-UTC}
    volumes:
      - signer-data:/data

volumes:
  tailscale-state:
  signer-data:
